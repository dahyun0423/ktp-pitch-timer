<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>K-TECH PIONEERS · Pitch Timer</title>
<link rel="preload" href="fonts/digital7-mono.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/digital7.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/karrot-bold.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/panchang.woff2" as="font" type="font/woff2" crossorigin />
<style>
  @font-face { font-family: "Digital7Mono"; src: url(fonts/digital7-mono.woff2) format("woff2"); font-display: block; }
  @font-face { font-family: "Digital7"; src: url(fonts/digital7.woff2) format("woff2"); font-display: block; }
  @font-face { font-family: "KarrotSans"; src: url(fonts/karrot-bold.woff2) format("woff2"); font-weight: 700; font-display: block; }
  @font-face { font-family: "Panchang"; src: url(fonts/panchang.woff2) format("woff2"); font-weight: 200 800; font-display: block; }

  :root {
    --red: #ff3b3b;
    --glow: #479deb;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  body.idle-cursor { cursor: none; }

  /* 배경: 지구 이미지 + 세계지도 (Figma에서 합성) */
  .bg {
    position: fixed; inset: 0;
    background: #000 url(assets/bg.jpg) center bottom / cover no-repeat;
  }
  .dim {
    position: fixed; inset: 0;
    background: #000;
    opacity: .3;
    transition: opacity .8s ease;
  }
  body[data-state="done"] .dim { opacity: .6; }

  /* 1440×1024 Figma 프레임을 화면에 맞게 스케일 */
  .stage {
    position: fixed;
    left: 50%; top: 50%;
    width: 1440px; height: 1024px;
    transform: translate(-50%, -50%) scale(var(--scale, 1));
  }

  .logo {
    position: absolute;
    left: 50%; top: 78.33px;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center;
    font-family: "Panchang", sans-serif; font-weight: 700;
  }
  .logo-row { display: flex; align-items: center; gap: 7.44px; width: 337.594px; margin-bottom: -3px; }
  .logo-row span { font-size: 28.8px; line-height: 1.6; white-space: nowrap; }
  .logo-row img { width: 167.04px; height: 20.16px; display: block; }
  .logo-sub { font-size: 13.2px; line-height: 1.4; letter-spacing: 1.056px; white-space: nowrap; }

  .label {
    position: absolute;
    left: 0; right: 0; top: 286.3px;
    text-align: center;
    font-family: "KarrotSans", sans-serif; font-weight: 700;
    font-size: 37.8px; line-height: 1.6;
    white-space: pre;
    transition: color .3s;
  }

  .time {
    position: absolute;
    left: 0; right: 0; top: 264px;
    text-align: center;
    font-family: "Digital7Mono", monospace;
    font-size: 315px; line-height: 1.6;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    transition: color .3s;
  }

  body[data-state="final"] .label,
  body[data-state="final"] .time { color: var(--red); }

  /* 일시정지: 콜론 깜빡임 대신 전체를 살짝 흐리게 */
  body[data-paused="true"]:not([data-state="final"]) .time { animation: blink 1.2s steps(1) infinite; }
  body[data-paused="true"][data-state="final"] .time { animation-play-state: paused; }
  @keyframes blink { 50% { opacity: .35; } }

  /* 마지막 1분: 심장박동 (쿵-쿵, 쉬고) + 뒤에서 뛰는 빨간 글로우 */
  .heart {
    position: fixed; left: 50%; top: 50%;
    width: 120vmax; height: 120vmax;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 59, 59, .26) 0%, rgba(255, 59, 59, .08) 22%, rgba(0, 0, 0, 0) 50%);
    opacity: 0; pointer-events: none;
  }
  .edge {
    position: fixed; inset: 0; pointer-events: none; opacity: 0;
    box-shadow: inset 0 0 18vmin rgba(255, 30, 30, .55);
  }
  body[data-state="final"] .time {
    text-shadow: 0 0 40px rgba(255, 59, 59, .6);
    animation: heartbeat 1s ease-in-out infinite;
  }
  body[data-state="final"] .heart { animation: heartGlow 1s ease-in-out infinite; }
  @keyframes heartbeat {
    0% { transform: scale(1); } 14% { transform: scale(1.07); } 28% { transform: scale(1); }
    42% { transform: scale(1.045); } 70%, 100% { transform: scale(1); }
  }
  @keyframes heartGlow {
    0% { opacity: .25; } 14% { opacity: 1; } 28% { opacity: .35; }
    42% { opacity: .8; } 70%, 100% { opacity: .25; }
  }

  /* 마지막 10초: 비정상 박동 — 빨라지고, 세지고, 박자가 불규칙 + 화면 가장자리 붉게 떨림 */
  body[data-state="final"][data-last10="true"] .time { animation: arrhythmia 1.3s linear infinite; }
  body[data-state="final"][data-last10="true"] .heart { animation: arrhythmiaGlow 1.3s linear infinite; }
  body[data-state="final"][data-last10="true"] .edge { animation: arrhythmiaGlow 1.3s linear infinite; }
  body[data-state="final"][data-last10="true"] .stage { animation: tremor .12s linear infinite; }
  @keyframes arrhythmia {
    0% { transform: scale(1); }
    6% { transform: scale(1.12); }   /* 쿵 */
    13% { transform: scale(.99); }
    19% { transform: scale(1.07); }  /* 쿵 */
    27% { transform: scale(1); }
    38% { transform: scale(1.1); }   /* 박자 당겨짐 */
    45% { transform: scale(.99); }
    49% { transform: scale(1.05); }
    55% { transform: scale(1); }
    72% { transform: scale(1.13); }  /* 늦게 크게 */
    80% { transform: scale(.99); }
    86% { transform: scale(1.06); }
    94%, 100% { transform: scale(1); }
  }
  @keyframes arrhythmiaGlow {
    0% { opacity: .3; } 6% { opacity: 1; } 13% { opacity: .4; } 19% { opacity: .85; } 27% { opacity: .3; }
    38% { opacity: 1; } 45% { opacity: .4; } 49% { opacity: .7; } 55% { opacity: .3; }
    72% { opacity: 1; } 80% { opacity: .4; } 86% { opacity: .8; } 94%, 100% { opacity: .3; }
  }
  @keyframes tremor {
    0% { transform: translate(-50%, -50%) scale(var(--scale, 1)) translate(0, 0); }
    25% { transform: translate(-50%, -50%) scale(var(--scale, 1)) translate(1.5px, -1px); }
    50% { transform: translate(-50%, -50%) scale(var(--scale, 1)) translate(-1.5px, 1px); }
    75% { transform: translate(-50%, -50%) scale(var(--scale, 1)) translate(1px, 1.5px); }
    100% { transform: translate(-50%, -50%) scale(var(--scale, 1)) translate(0, 0); }
  }

  /* 일시정지 중에는 박동 멈춤 */
  body[data-paused="true"] .heart,
  body[data-paused="true"] .edge,
  body[data-paused="true"] .stage { animation-play-state: paused; }

  .timesup {
    position: absolute;
    left: 0; right: 0; top: 264px;
    display: flex; justify-content: center;
    font-family: "Digital7", monospace;
    font-size: 300px; line-height: 1.6;
    white-space: nowrap;
    filter: drop-shadow(0 4px 30px var(--glow));
  }
  .timesup span {
    background-image: linear-gradient(90deg,
      rgba(10, 51, 217, 0) 0%,
      rgb(33, 102, 255) 6.7166%,
      rgb(64, 163, 255) 59.526%,
      rgb(178, 229, 255) 102.61%,
      rgba(20, 89, 255, 0) 123.45%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .thanks {
    position: absolute;
    left: 0; right: 0; top: 653px;
    text-align: center;
    font-family: "KarrotSans", sans-serif; font-weight: 700;
    font-size: 37.8px; line-height: 1.6;
  }

  .timesup, .thanks { opacity: 0; pointer-events: none; }
  body[data-state="done"] .label,
  body[data-state="done"] .time { opacity: 0; }
  body[data-state="done"] .timesup { animation: slam .7s cubic-bezier(.2, 1.4, .4, 1) forwards, glow 2.4s ease-in-out .7s infinite; }
  body[data-state="done"] .thanks { animation: rise .6s ease-out .5s forwards; }
  @keyframes slam {
    0% { opacity: 0; transform: scale(1.35); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes glow {
    0%, 100% { filter: drop-shadow(0 4px 30px var(--glow)); }
    50% { filter: drop-shadow(0 4px 60px var(--glow)) brightness(1.15); }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 종료 순간 화면 플래시 */
  .flash {
    position: fixed; inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .95) 0%, rgba(255, 190, 120, .6) 30%, rgba(71, 157, 235, .25) 60%, rgba(71, 157, 235, 0) 85%);
    opacity: 0; pointer-events: none;
  }
  .flash.on { animation: flash 1.1s ease-out; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
  body.boom .stage { animation: shake .8s cubic-bezier(.36, .07, .19, .97) both; }
  @keyframes shake {
    10%, 90% { transform: translate(-50%, -50%) scale(var(--scale, 1)) translate(-2px, 0); }
    20%, 80% { transform: translate(-50%, -50%) scale(var(--scale, 1)) translate(5px, -3px); }
    30%, 50%, 70% { transform: translate(-50%, -50%) scale(var(--scale, 1)) translate(-9px, 4px); }
    40%, 60% { transform: translate(-50%, -50%) scale(var(--scale, 1)) translate(9px, -4px); }
  }

  /* 단축키 안내 (전체화면이 아니면 표시, 3초 후 흐려짐) */
  .help {
    position: fixed; left: 50%; bottom: 20px;
    transform: translateX(-50%);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(0, 0, 0, .45);
    backdrop-filter: blur(6px);
    font: 500 13px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    color: rgba(255, 255, 255, .75);
    transition: opacity .6s;
  }
  .help kbd {
    display: inline-block; min-width: 22px;
    padding: 1px 6px; margin-right: 4px;
    border: 1px solid rgba(255, 255, 255, .3); border-radius: 5px;
    font: inherit; text-align: center; color: #fff;
  }
  .help.hidden { opacity: 0; pointer-events: none; }
  .toast {
    position: fixed; right: 20px; top: 20px;
    padding: 8px 14px; border-radius: 8px;
    background: rgba(0, 0, 0, .55);
    font: 600 14px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    opacity: 0; transition: opacity .3s;
  }
  .toast.on { opacity: 1; }
  @media (max-width: 640px) { .help { display: none; } }
</style>
</head>
<body data-state="ready" data-paused="false">
  <div class="bg"></div>
  <div class="dim"></div>
  <div class="heart"></div>
  <div class="edge"></div>
  <div class="flash" id="flash"></div>

  <main class="stage" id="stage">
    <div class="logo" aria-label="K-TECH PIONEERS NETWORKING DAY">
      <div class="logo-row">
        <span>K-TECH</span>
        <img src="assets/logo_subtract.svg" alt="PIONEERS" />
      </div>
      <div class="logo-sub">NETWORKING DAY</div>
    </div>

    <div class="label" id="label">READY</div>
    <div class="time" id="time">03:00</div>

    <div class="timesup" aria-hidden="true"><span>TIME’S UP</span></div>
    <div class="thanks">발표 종료 ・ 감사합니다</div>
  </main>

  <div class="help" id="help">
    <span><kbd>Space</kbd>시작/일시정지</span>
    <span><kbd>R</kbd>리셋</span>
    <span><kbd>F</kbd>전체화면</span>
    <span><kbd>+</kbd><kbd>−</kbd><kbd>↑</kbd><kbd>↓</kbd>±1분</span>
    <span><kbd>Shift</kbd>+조정 ±10초</span>
    <span><kbd>T</kbd>10초 전으로</span>
    <span><kbd>M</kbd>음소거</span>
  </div>
  <div class="toast" id="toast"></div>

<script>
(() => {
  const DEFAULT_SEC = 180;
  const FINAL_SEC = 60;
  const MAX_SEC = 99 * 60 + 59;

  const $ = (id) => document.getElementById(id);
  const body = document.body;
  const timeEl = $("time"), labelEl = $("label"), helpEl = $("help"), toastEl = $("toast"), flashEl = $("flash");

  let duration = DEFAULT_SEC * 1000;   // 설정된 시간 (R 누르면 여기로 복귀)
  let remaining = duration;            // 남은 시간 (ms)
  let endAt = 0;                       // 실행 중일 때 종료 시각 (performance.now 기준)
  let running = false;
  let done = false;
  let muted = false;
  let raf = 0;

  // ---------- 화면 스케일 ----------
  function fit() {
    const s = Math.min(innerWidth / 1440, innerHeight / 1024);
    $("stage").style.setProperty("--scale", s);
  }
  addEventListener("resize", fit);
  fit();

  // ---------- 렌더 ----------
  function fmt(ms) {
    const total = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(total / 60), s = total % 60;
    return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }

  function render() {
    const secs = Math.ceil(remaining / 1000);
    let state = "ready", label = "READY";
    if (done) {
      state = "done"; label = "";
    } else if (running || remaining < duration) {
      state = secs <= FINAL_SEC ? "final" : "running";
      label = secs <= FINAL_SEC ? "FINAL  1 MIN" : "";
      if (!running) label = secs <= FINAL_SEC ? "FINAL  1 MIN" : "PAUSED";
    }
    body.dataset.state = state;
    body.dataset.paused = String(!running && !done && remaining < duration);
    body.dataset.last10 = String(!done && secs <= 10 && remaining < duration);
    labelEl.textContent = label;
    const t = fmt(remaining);
    if (timeEl.textContent !== t) timeEl.textContent = t;
    document.title = done ? "TIME'S UP · Pitch Timer" : t + " · Pitch Timer";
  }

  function tick() {
    remaining = endAt - performance.now();
    if (remaining <= 0) {
      remaining = 0;
      finish();
      return;
    }
    render();
    raf = requestAnimationFrame(tick);
  }

  // ---------- 제어 ----------
  function start() {
    if (done || remaining <= 0) return;
    ensureAudio();
    running = true;
    endAt = performance.now() + remaining;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(tick);
    render();
  }

  function pause() {
    running = false;
    cancelAnimationFrame(raf);
    remaining = Math.max(0, endAt - performance.now());
    render();
  }

  function reset() {
    running = false; done = false;
    cancelAnimationFrame(raf);
    remaining = duration;
    body.classList.remove("boom");
    stopSound();
    render();
  }

  function finish() {
    running = false; done = true;
    cancelAnimationFrame(raf);
    render();
    flashEl.classList.remove("on"); body.classList.remove("boom");
    void flashEl.offsetWidth;
    flashEl.classList.add("on"); body.classList.add("boom");
    playTimesUp();
  }

  function adjust(deltaSec) {
    if (done) return;
    const delta = deltaSec * 1000;
    const isIdle = !running && remaining === duration;
    if (isIdle) {
      // 시작 전: 설정 시간 자체를 바꿈 (최소 10초)
      duration = clamp(duration + delta, 10000, MAX_SEC * 1000);
      remaining = duration;
    } else {
      // 진행/일시정지 중: 남은 시간만 조정
      const now = performance.now();
      const cur = running ? endAt - now : remaining;
      const next = clamp(cur + delta, 0, MAX_SEC * 1000);
      if (running) { endAt = now + next; remaining = next; if (next <= 0) return finish(); }
      else remaining = Math.max(next, 1000);
    }
    render();
    toast((deltaSec > 0 ? "+" : "−") + fmtDelta(Math.abs(deltaSec)));
  }

  // T: 남은 시간을 10초로 (리허설·사운드 체크용)
  function jumpTo(sec) {
    if (done) return;
    const ms = sec * 1000;
    if (running) endAt = performance.now() + ms;
    remaining = ms;
    render();
    toast(sec + "초 전으로 이동");
  }

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const fmtDelta = (s) => (s >= 60 ? s / 60 + "분" : s + "초");

  function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
    else document.exitFullscreen?.();
  }

  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("on"), 900);
  }

  // ---------- 사운드 (Web Audio로 합성, 외부 파일 없음) ----------
  // 0초 전까지는 무음, 0초에 폭발음 "펑" 한 번. 놀라지 않을 정도로 음량 제한.
  const BOOM_VOLUME = 0.7;   // 0~1, 더 크게/작게 하려면 이 값만 조정
  let ctx = null, bus = null, reverb = null, voices = [];

  function ensureAudio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      ({ bus, reverb } = buildChain(ctx, ctx.destination));
    }
    if (ctx.state === "suspended") ctx.resume();
  }

  // 마스터 체인: 리미터(컴프레서)로 피크를 눌러 갑자기 튀지 않게 + 합성 잔향
  function buildChain(ac, dest) {
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 4; comp.ratio.value = 12;
    comp.attack.value = 0.002; comp.release.value = 0.3;
    const out = ac.createGain(); out.gain.value = BOOM_VOLUME;
    comp.connect(out); out.connect(dest);

    const bus = ac.createGain(); bus.connect(comp);

    const len = Math.floor(ac.sampleRate * 3);
    const ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
    }
    const conv = ac.createConvolver(); conv.buffer = ir;
    const reverb = ac.createGain(); reverb.gain.value = 0.35;
    reverb.connect(conv); conv.connect(comp);
    return { bus, reverb };
  }

  function track(node) { voices.push(node); return node; }

  // 갈색 노이즈(저역이 두꺼운 노이즈) — 폭발의 "우르릉" 몸통
  function brownNoise(ac, sec) {
    const b = ac.createBuffer(1, Math.floor(ac.sampleRate * sec), ac.sampleRate);
    const d = b.getChannelData(0);
    let last = 0;
    for (let i = 0; i < d.length; i++) {
      last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
      d[i] = last * 3.5;
    }
    return b;
  }
  function whiteNoise(ac, sec) {
    const b = ac.createBuffer(1, Math.floor(ac.sampleRate * sec), ac.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }

  function explosion(ac, t) {
    // 1) 크랙: 아주 짧은 고역 노이즈 "탁"
    const crack = track(ac.createBufferSource()); crack.buffer = whiteNoise(ac, 0.08);
    const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1800;
    const cg = ac.createGain();
    cg.gain.setValueAtTime(0.5, t); cg.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    crack.connect(hp); hp.connect(cg); cg.connect(bus); cg.connect(reverb);
    crack.start(t);

    // 2) 서브 쿵: 저음 사인이 뚝 떨어짐
    const sub = track(ac.createOscillator()), sg = ac.createGain();
    sub.type = "sine";
    sub.frequency.setValueAtTime(90, t);
    sub.frequency.exponentialRampToValueAtTime(28, t + 1.2);
    sg.gain.setValueAtTime(0.0001, t);
    sg.gain.exponentialRampToValueAtTime(1.0, t + 0.008);
    sg.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
    sub.connect(sg); sg.connect(bus);
    sub.start(t); sub.stop(t + 1.5);

    // 3) 몸통: 넓은 노이즈가 밝게 터졌다가 어두워지며 길게 잦아듦 ("펑~ 우르릉")
    const body_ = track(ac.createBufferSource()); body_.buffer = whiteNoise(ac, 3.5);
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 0.7;
    lp.frequency.setValueAtTime(5000, t);
    lp.frequency.exponentialRampToValueAtTime(700, t + 0.25);
    lp.frequency.exponentialRampToValueAtTime(120, t + 3);
    const bg = ac.createGain();
    bg.gain.setValueAtTime(0.0001, t);
    bg.gain.exponentialRampToValueAtTime(0.9, t + 0.006);
    bg.gain.exponentialRampToValueAtTime(0.25, t + 0.4);
    bg.gain.exponentialRampToValueAtTime(0.0001, t + 3.2);
    body_.connect(lp); lp.connect(bg); bg.connect(bus); bg.connect(reverb);
    body_.start(t); body_.stop(t + 3.5);

    // 4) 저역 럼블 꼬리
    const rum = track(ac.createBufferSource()); rum.buffer = brownNoise(ac, 3.5);
    const rlp = ac.createBiquadFilter(); rlp.type = "lowpass"; rlp.frequency.value = 180;
    const rg = ac.createGain();
    rg.gain.setValueAtTime(0.0001, t);
    rg.gain.exponentialRampToValueAtTime(0.9, t + 0.05);
    rg.gain.exponentialRampToValueAtTime(0.0001, t + 3.3);
    rum.connect(rlp); rlp.connect(rg); rg.connect(bus);
    rum.start(t); rum.stop(t + 3.5);
  }

  function playTimesUp() {
    if (muted) return;
    ensureAudio();
    if (!ctx) return;
    stopSound();
    explosion(ctx, ctx.currentTime + 0.02);
  }

  function stopSound() {
    voices.forEach((n) => { try { n.stop(); } catch (e) {} });
    voices = [];
  }

  // ---------- 키보드 ----------
  addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const step = e.shiftKey ? 10 : 60;
    switch (e.code) {
      case "Space":
        e.preventDefault();
        if (e.repeat) return;
        if (done) return;
        running ? pause() : start();
        break;
      case "KeyR": reset(); break;
      case "KeyF": toggleFullscreen(); break;
      case "KeyT": jumpTo(10); break;
      case "KeyM":
        muted = !muted;
        if (muted) stopSound();
        toast(muted ? "음소거" : "소리 켜짐");
        break;
      case "ArrowUp": case "Equal": case "NumpadAdd":
        e.preventDefault(); adjust(step); break;
      case "ArrowDown": case "Minus": case "NumpadSubtract":
        e.preventDefault(); adjust(-step); break;
      default: return;
    }
    showHelpBriefly();
  });

  // 화면 클릭/탭 = 시작/일시정지 (키보드 없는 환경 대비), 더블클릭 = 전체화면
  $("stage").addEventListener("click", () => { if (!done) running ? pause() : start(); });
  addEventListener("dblclick", toggleFullscreen);

  // ---------- 안내 & 커서 자동 숨김 ----------
  let helpTimer, cursorTimer;
  function showHelpBriefly() {
    helpEl.classList.toggle("hidden", !!document.fullscreenElement || running);
    clearTimeout(helpTimer);
    helpTimer = setTimeout(() => helpEl.classList.add("hidden"), 3000);
  }
  addEventListener("mousemove", () => {
    body.classList.remove("idle-cursor");
    helpEl.classList.remove("hidden");
    clearTimeout(cursorTimer); clearTimeout(helpTimer);
    cursorTimer = setTimeout(() => body.classList.add("idle-cursor"), 2000);
    helpTimer = setTimeout(() => helpEl.classList.add("hidden"), 3000);
  });
  document.addEventListener("fullscreenchange", showHelpBriefly);

  render();
  showHelpBriefly();
})();
</script>
</body>
</html>
